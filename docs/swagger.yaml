basePath: /api/v1
definitions:
  financial.ImpactEstimate:
    properties:
      description:
        type: string
      monthly_change:
        type: number
      net_worth_change:
        type: number
    type: object
  financial.ProposedAction:
    properties:
      call_id:
        type: string
      dependencies:
        items:
          type: string
        type: array
      estimated_impact:
        $ref: '#/definitions/financial.ImpactEstimate'
      friendly_description:
        type: string
      parameters:
        additionalProperties: true
        type: object
      tool_name:
        type: string
      warnings:
        items:
          $ref: '#/definitions/financial.Warning'
        type: array
    type: object
  financial.Warning:
    properties:
      message:
        type: string
      severity:
        description: '"low", "medium", "high"'
        type: string
      type:
        type: string
    type: object
  handlers.ChatRequest:
    properties:
      chat_id:
        type: string
      message:
        type: string
      session_id:
        type: string
    required:
    - chat_id
    - message
    - session_id
    type: object
  handlers.ChatResponse:
    properties:
      actions_executed:
        type: integer
      api_version:
        type: string
      content:
        type: string
      conversation_flow:
        items:
          $ref: '#/definitions/session.ConversationStep'
        type: array
      message_id:
        type: string
      proposed_actions:
        items:
          $ref: '#/definitions/financial.ProposedAction'
        type: array
      requires_approval:
        type: boolean
    type: object
  handlers.DispatchRequest:
    properties:
      selected_actions:
        items:
          $ref: '#/definitions/handlers.SelectedAction'
        type: array
      session_id:
        type: string
    required:
    - selected_actions
    - session_id
    type: object
  handlers.DispatchResponse:
    properties:
      api_version:
        type: string
      results:
        items:
          $ref: '#/definitions/handlers.ExecutionResult'
        type: array
      summary:
        $ref: '#/definitions/handlers.ExecutionSummary'
      updated_session_state:
        $ref: '#/definitions/session.SessionState'
    type: object
  handlers.ExecutionResult:
    properties:
      call_id:
        type: string
      entity_id:
        type: string
      error:
        type: string
      execution_time_ms:
        type: integer
      rolled_back:
        type: boolean
      success:
        type: boolean
      tool_name:
        type: string
    type: object
  handlers.ExecutionSummary:
    properties:
      failed:
        type: integer
      skipped:
        type: integer
      status:
        description: '"success", "partial_success", "failed"'
        type: string
      successful:
        type: integer
      total_actions:
        type: integer
      total_execution_time_ms:
        type: integer
    type: object
  handlers.HealthResponse:
    properties:
      services:
        additionalProperties: true
        type: object
      status:
        type: string
      timestamp:
        type: string
      uptime:
        type: string
      version:
        type: string
    type: object
  handlers.SelectedAction:
    properties:
      approved:
        type: boolean
      call_id:
        type: string
      modified_args:
        additionalProperties: true
        type: object
    required:
    - call_id
    type: object
  handlers.scenarioEventInput:
    properties:
      description:
        type: string
      display_color:
        type: string
      display_icon:
        type: string
      displayColor:
        type: string
      displayIcon:
        type: string
      id:
        type: string
      impacts:
        items:
          $ref: '#/definitions/handlers.scenarioImpactInput'
        type: array
      is_included:
        type: boolean
      isIncluded:
        type: boolean
      name:
        type: string
      occurs_on:
        type: string
      occursOn:
        type: string
      scenario_id:
        type: string
      scenarioId:
        type: string
      tags:
        items:
          type: string
        type: array
    type: object
  handlers.scenarioImpactInput:
    properties:
      amount:
        type: integer
      cadence:
        type: string
      currency:
        type: string
      end_month:
        type: string
      endMonth:
        type: string
      impact_kind:
        type: string
      impactKind:
        type: string
      notes:
        type: string
      start_month:
        type: string
      startMonth:
        type: string
      target_id:
        type: string
      target_type:
        type: string
      targetId:
        type: string
      targetType:
        type: string
    type: object
  llm.ChatMessage:
    properties:
      content:
        description: Message content
        type: string
      name:
        description: Optional name for tool messages
        type: string
      role:
        description: '"user", "assistant", "system", "tool"'
        type: string
      tool_call_id:
        description: ID of tool call this message responds to
        type: string
      tool_calls:
        description: Tool calls in this message
        items:
          $ref: '#/definitions/llm.ToolCall'
        type: array
    type: object
  llm.FunctionCall:
    properties:
      arguments:
        description: JSON string of function arguments
        type: string
      name:
        description: Function name (e.g., "create_asset")
        type: string
    type: object
  llm.ToolCall:
    properties:
      function:
        allOf:
        - $ref: '#/definitions/llm.FunctionCall'
        description: Function details
      id:
        description: Unique identifier for this tool call
        type: string
      type:
        description: Always "function" for function calls
        type: string
    type: object
  repository.ScenarioEvent:
    properties:
      createdAt:
        type: string
      description:
        type: string
      displayColor:
        type: string
      displayIcon:
        type: string
      id:
        type: string
      impacts:
        items:
          $ref: '#/definitions/repository.ScenarioImpact'
        type: array
      isIncluded:
        type: boolean
      name:
        type: string
      occursOn:
        type: string
      scenarioID:
        type: string
      tags:
        items:
          type: string
        type: array
      updatedAt:
        type: string
      userID:
        type: string
    type: object
  repository.ScenarioImpact:
    properties:
      amount:
        format: int64
        type: integer
      cadence:
        type: string
      createdAt:
        type: string
      currency:
        type: string
      endMonth:
        type: string
      eventID:
        type: string
      id:
        type: string
      impactKind:
        type: string
      notes:
        type: string
      startMonth:
        type: string
      targetID:
        type: string
      targetType:
        type: string
    type: object
  session.ConversationStep:
    properties:
      content:
        type: string
      result:
        additionalProperties: true
        type: object
      step_id:
        type: string
      timestamp:
        type: string
      tool_calls:
        items:
          type: string
        type: array
      tool_name:
        type: string
      type:
        description: '"user_message", "llm_response", "tool_execution"'
        type: string
    type: object
  session.PendingToolCall:
    properties:
      call_id:
        type: string
      created_at:
        type: string
      dependencies:
        items:
          type: string
        type: array
      friendly_description:
        type: string
      parameters:
        additionalProperties: true
        type: object
      preview:
        type: string
      tool_name:
        type: string
    type: object
  session.SessionState:
    properties:
      chat_id:
        type: string
      conversation_flow:
        items:
          $ref: '#/definitions/session.ConversationStep'
        type: array
      created_at:
        type: string
      last_asset_id:
        type: string
      last_liability_id:
        type: string
      last_property_plan_id:
        type: string
      messages:
        items:
          $ref: '#/definitions/llm.ChatMessage'
        type: array
      metadata:
        additionalProperties:
          type: string
        type: object
      pending_actions:
        items:
          $ref: '#/definitions/session.PendingToolCall'
        type: array
      session_id:
        type: string
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  timeline.EventImpactSummary:
    properties:
      amountAnnual:
        description: annualized
        type: number
      amountMonthly:
        type: number
      cadence:
        type: string
      eventId:
        type: string
      impactKind:
        description: override|delta|start|stop
        type: string
      notes:
        type: string
    type: object
  timeline.GrowthApplied:
    properties:
      annualRatePct:
        type: number
      category:
        type: string
    type: object
  timeline.ItemType:
    enum:
    - asset
    - liability
    - income
    - expense
    - cash_account
    type: string
    x-enum-varnames:
    - ItemTypeAsset
    - ItemTypeLiability
    - ItemTypeIncome
    - ItemTypeExpense
    - ItemTypeCashAccount
  timeline.TimelineItem:
    properties:
      adjAnnualAmt:
        type: number
      adjMonthlyAmt:
        description: Adjusted monthly amount
        type: number
      amountAnnual:
        type: number
      amountMonthly:
        description: Monthly amount (when resolution is monthly)
        type: number
      category:
        type: string
      createdMonth:
        description: Month when created (1-12)
        type: integer
      createdYear:
        type: integer
      eventImpacts:
        items:
          $ref: '#/definitions/timeline.EventImpactSummary'
        type: array
      growthRate:
        description: GrowthRate is the per-item annual growth rate (percentage)
        type: number
      isAccumulator:
        description: IsAccumulator indicates this is the designated cash account receiving
          net savings (cash accounts only)
        type: boolean
      itemId:
        description: ItemID is the stable logical identifier used for scenario matching
          (parent_id if present, else row id).
        type: string
      itemType:
        $ref: '#/definitions/timeline.ItemType'
      name:
        type: string
      parentId:
        description: ParentID is the original/base item id when this row is a child;
          else same as RowID.
        type: string
      rowId:
        description: RowID is the concrete finance_* row id (for debugging/reference).
        type: string
      sourceAmount:
        type: number
      sourceFrequency:
        type: string
    type: object
  timeline.TimelineMonth:
    properties:
      accumulatedCashEnd:
        type: number
      accumulatedCashStart:
        type: number
      accumulatorAccountId:
        type: string
      assets:
        items:
          $ref: '#/definitions/timeline.TimelineItem'
        type: array
      cashAccounts:
        items:
          $ref: '#/definitions/timeline.TimelineItem'
        type: array
      expenses:
        items:
          $ref: '#/definitions/timeline.TimelineItem'
        type: array
      growthApplied:
        items:
          $ref: '#/definitions/timeline.GrowthApplied'
        type: array
      hasOverrides:
        type: boolean
      income:
        items:
          $ref: '#/definitions/timeline.TimelineItem'
        type: array
      interestEarned:
        type: number
      liabilities:
        items:
          $ref: '#/definitions/timeline.TimelineItem'
        type: array
      month:
        description: Month number (1-12)
        type: integer
      monthIndex:
        description: 0-based global month index
        type: integer
      monthlyNetSavings:
        description: Monthly cash accumulation tracking
        type: number
      netCash:
        description: Monthly net savings
        type: number
      netWorth:
        type: number
      year:
        description: Calendar year (e.g., 2025)
        type: integer
      yearIndex:
        description: 0-based year index
        type: integer
    type: object
  timeline.TimelineResponse:
    properties:
      months:
        items:
          $ref: '#/definitions/timeline.TimelineMonth'
        type: array
      resolution:
        description: '"yearly" or "monthly"'
        type: string
      scenariosApplied:
        description: ScenariosApplied lists scenario IDs merged into this response
          (optional).
        items:
          type: string
        type: array
      version:
        type: string
      years:
        items:
          $ref: '#/definitions/timeline.TimelineYear'
        type: array
    type: object
  timeline.TimelineYear:
    properties:
      accumulatedCashEnd:
        description: Cash balance at end of year (after interest)
        type: number
      accumulatedCashStart:
        description: Cash balance at start of year
        type: number
      accumulatorAccountId:
        description: ID of the accumulator cash account
        type: string
      annualNetSavings:
        description: Cash accumulation tracking
        type: number
      assets:
        items:
          $ref: '#/definitions/timeline.TimelineItem'
        type: array
      cashAccounts:
        description: Cash accounts from cash_accounts table
        items:
          $ref: '#/definitions/timeline.TimelineItem'
        type: array
      expenses:
        items:
          $ref: '#/definitions/timeline.TimelineItem'
        type: array
      growthApplied:
        items:
          $ref: '#/definitions/timeline.GrowthApplied'
        type: array
      hasOverrides:
        type: boolean
      income:
        items:
          $ref: '#/definitions/timeline.TimelineItem'
        type: array
      interestEarned:
        description: Interest earned this year on accumulator
        type: number
      liabilities:
        items:
          $ref: '#/definitions/timeline.TimelineItem'
        type: array
      netCash:
        description: Income - Expenses (annual net savings)
        type: number
      netWorth:
        description: Assets + CashAccounts - Liabilities
        type: number
      year:
        type: integer
    type: object
host: localhost:8080
info:
  contact:
    email: support@example.com
    name: API Support
  description: API for managing financial data, chat interactions, and scenario planning
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: Financial Chat System API
  version: "1.0"
paths:
  /chat:
    post:
      consumes:
      - application/json
      description: Process a chat message and generate AI response with financial
        tool calls
      parameters:
      - description: Chat message
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.ChatRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ChatResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Send a chat message
      tags:
      - Chat
  /financial/actions/dispatch:
    post:
      consumes:
      - application/json
      description: Execute approved financial actions from a chat session
      parameters:
      - description: Actions to execute
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.DispatchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.DispatchResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
      summary: Execute financial actions
      tags:
      - Actions
  /financial/timeline:
    get:
      description: Returns the full financial timeline with optional resolution and
        scenario filtering
      parameters:
      - description: Resolution override (yearly or monthly)
        in: query
        name: resolution
        type: string
      - description: Include scenario impacts
        in: query
        name: include_scenarios
        type: boolean
      - description: Comma-separated list of scenario IDs
        in: query
        name: scenario_ids
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/timeline.TimelineResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get financial timeline
      tags:
      - Timeline
  /financial/timeline/{year}:
    put:
      consumes:
      - application/json
      description: Upserts financial data edits for a given year
      parameters:
      - description: Year (absolute)
        in: path
        name: year
        required: true
        type: integer
      - description: Year edits
        in: body
        name: body
        required: true
        schema:
          additionalProperties: true
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/timeline.TimelineResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      summary: Update financial data for a specific year
      tags:
      - Timeline
  /health:
    get:
      description: Get the health status of the application
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.HealthResponse'
      summary: Health check
      tags:
      - Health
  /scenario-events:
    get:
      consumes:
      - application/json
      description: List all scenario events or create a new one
      parameters:
      - description: New scenario event
        in: body
        name: body
        schema:
          $ref: '#/definitions/handlers.scenarioEventInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/repository.ScenarioEvent'
            type: array
        "201":
          description: Created
          schema:
            $ref: '#/definitions/repository.ScenarioEvent'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: List or create scenario events
      tags:
      - Scenario Events
    post:
      consumes:
      - application/json
      description: List all scenario events or create a new one
      parameters:
      - description: New scenario event
        in: body
        name: body
        schema:
          $ref: '#/definitions/handlers.scenarioEventInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/repository.ScenarioEvent'
            type: array
        "201":
          description: Created
          schema:
            $ref: '#/definitions/repository.ScenarioEvent'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: List or create scenario events
      tags:
      - Scenario Events
  /tools:
    get:
      description: Returns a list of all available financial tools and their metadata
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Get available financial tools
      tags:
      - Health
schemes:
- http
- https
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: X-API-Key
    type: apiKey
swagger: "2.0"
