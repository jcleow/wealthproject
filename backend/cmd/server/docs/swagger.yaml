    - cash_account
    type: string
    x-enum-varnames:
    - ItemTypeAsset
    - ItemTypeLiability
    - ItemTypeIncome
    - ItemTypeExpense
    - ItemTypeCashAccount
  timeline.TimelineItem:
    properties:
      adjAnnualAmt:
        type: number
      adjMonthlyAmt:
        description: Adjusted monthly amount
        type: number
      amountAnnual:
        type: number
      amountMonthly:
        description: Monthly amount (when resolution is monthly)
        type: number
      category:
        type: string
      eventImpacts:
        items:
          $ref: '#/definitions/timeline.EventImpactSummary'
        type: array
      growthRate:
        description: GrowthRate is the per-item annual growth rate (percentage)
