    - FrequencyWeekly
    - FrequencyBiweekly
    - FrequencyMonthly
    - FrequencyQuarterly
    - FrequencySemiannual
    - FrequencyAnnual
  financial-chat-system_backend_internal_financial_v2_repository.Expense:
    properties:
      amount:
