        $ref: '#/definitions/timeline.ItemType'
      name:
        type: string
      parentId:
        description: ParentID is the original/base item id when this row is a child;
          else same as RowID.
        type: string
      rowId:
        description: RowID is the concrete finance_* row id (for debugging/reference).
        type: string
      sourceAmount:
        type: number
      sourceFrequency:
        type: string
      startMonth:
        description: Month when item started (1-12)
        type: integer
      startYear:
        type: integer
    type: object
