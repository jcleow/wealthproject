basePath: /api
definitions:
  cmd_server_handlers.ChatRequest:
    properties:
      chat_id:
        type: string
      message:
        type: string
      session_id:
        type: string
    required:
    - chat_id
    - message
    - session_id
    type: object
  cmd_server_handlers.ChatResponse:
    properties:
      actions_executed:
        type: integer
      api_version:
        type: string
      content:
        type: string
      conversation_flow:
        items:
          $ref: '#/definitions/financial-chat-system_backend_internal_session.ConversationStep'
        type: array
      message_id:
        type: string
      proposed_actions:
        items:
          $ref: '#/definitions/financial-chat-system_backend_internal_financial.ProposedAction'
        type: array
      requires_approval:
        type: boolean
    type: object
  cmd_server_handlers.DispatchRequest:
    properties:
      selected_actions:
        items:
          $ref: '#/definitions/cmd_server_handlers.SelectedAction'
        type: array
      session_id:
        type: string
    required:
    - selected_actions
    - session_id
    type: object
  cmd_server_handlers.DispatchResponse:
    properties:
      api_version:
        type: string
      results:
        items:
          $ref: '#/definitions/cmd_server_handlers.ExecutionResult'
        type: array
      summary:
        $ref: '#/definitions/cmd_server_handlers.ExecutionSummary'
      updated_session_state:
        $ref: '#/definitions/financial-chat-system_backend_internal_session.SessionState'
    type: object
  cmd_server_handlers.ExecutionResult:
    properties:
      call_id:
        type: string
      entity_id:
        type: string
      error:
        type: string
      execution_time_ms:
        type: integer
      rolled_back:
        type: boolean
      success:
        type: boolean
      tool_name:
        type: string
    type: object
  cmd_server_handlers.ExecutionSummary:
    properties:
      failed:
        type: integer
      skipped:
        type: integer
      status:
        description: '"success", "partial_success", "failed"'
        type: string
      successful:
        type: integer
      total_actions:
        type: integer
      total_execution_time_ms:
        type: integer
    type: object
