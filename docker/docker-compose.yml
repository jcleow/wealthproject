version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: financial-chat-postgres
    environment:
      POSTGRES_USER: financial_user
      POSTGRES_PASSWORD: financial_pass_dev_2024
      POSTGRES_DB: financial_chat
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financial_user -d financial_chat"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: financial-chat-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Uncomment when implementing full application
  # financial-backend:
  #   build:
  #     context: ..
  #     dockerfile: Dockerfile
  #   container_name: financial-chat-backend
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     - DB_HOST=postgres
  #     - DB_PORT=5432
  #     - DB_NAME=financial_chat
  #     - DB_USER=financial_user
  #     - DB_PASSWORD=financial_pass_dev_2024
